spring:
  application:
    name: bad-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/bad
    username: bad_user
    password: ${bad_password}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
#  autoconfigure:
#    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration
    defaultSchema: bad_schema
    schemas: bad_schema
    create-schemas: true